name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare Assets & Generate Checksums
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/*.apk release-assets/wazpay-debug.apk
          cp app/build/outputs/apk/release/*.apk release-assets/wazpay-release.apk
          
          cd release-assets
          sha256sum wazpay-debug.apk > wazpay-debug.apk.sha256
          sha256sum wazpay-release.apk > wazpay-release.apk.sha256
          cat *.sha256 > checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            release-assets/wazpay-debug.apk
            release-assets/wazpay-release.apk
            release-assets/checksums.sha256
          generate_release_notes: true
          draft: false
          prerelease: false